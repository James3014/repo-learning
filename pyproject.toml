[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repolearn"
version = "0.1.0.dev0"
description = "Portable human-learning contracts for preserving engineering judgment while coding with AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RepoLearn contributors" }]
dependencies = []

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
